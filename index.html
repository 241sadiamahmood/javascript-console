<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JAVASCRIPTs</title>
  </head>
  <body>
    <h1>JAVASCRIPT CONSOLE</h1>
    <script>
      // Create a variable city and store your city name.
      let city = "Karachi";
      console.log(city);
      //   Create a variable country and store your country name.
      let country = "Pakistan";
      console.log(country);
      // Create two variables firstName and lastName, then display the full name.
      let firstName = "Sadia";
      let lastName = "Mahmood";
      let fullName = firstName + " " + lastName;
      console.log(fullName);
      //   Create a variable marks and assign any number.
      let marks = 85;
      console.log(marks);
      //   Declare a variable without assigning a value and print it.
      let data;
      console.log(data);
      data = "Farah";
      console.log(data);
      //   Create a constant DAYS_IN_WEEK with the value 7.
      const DAYS_IN_WEEK = 7;
      console.log(DAYS_IN_WEEK);
      //   Swap the values of two variables.
      let e = 10;
      let f = 20;
      let temp = e;
      e = f;
      e = temp;
      console.log(e);
      console.log(f);
      //   Create three variables and display them in one console.log().
      let name1 = "Sadia";
      let age = 25;
      let state = "Karachi";
      console.log(name1, age, state);
      //   Find the data type of a variable using typeof.
      let age1 = 25;
      console.log(typeof age1);

      let name2 = "Sadia";
      console.log(typeof name2);

      // Create a string containing your favorite color.
      let favoriteColor = "Blue";
      console.log(favoriteColor);
      // Create a number representing your height.
      let height = 165;
      console.log(height);
      //   Create a boolean variable named isMarried.
      let isMarried = false;
      console.log(isMarried);
      // Create an variable  with your name and age.
      let name3 = "Sadia";
      let age2 = 25;
      console.log(name3, age2);
      //   Print the data type of each variable.
      let name4 = "Sadia";
      let age3 = 25;
      console.log(typeof name4, age3);

      // Add 25 and 15.
      // Subtract 80 from 100.
      // Multiply 12 by 5.
      // Divide 72 by 8.

      let addition = 25 + 15;
      let subtraction = 100 - 80;
      let multiplication = 12 * 5;
      let division = 72 / 8;

      console.log(addition);
      console.log(subtraction);
      console.log(multiplication);
      console.log(division);

      // 1. Find the remainder
      let remainder = 20 % 3;
      console.log(remainder);

      // 2. Increase a variable by 1
      let number = 10;
      number++;
      console.log(number);

      // 3. Decrease a variable by 1
      let data1 = 10;
      data1--;
      console.log(data1);

      // 4. Calculate 5 to the power of 3
      let result = 5 ** 3;
      console.log(result);

      // 1. Use += to add 10 to a variable
      let number1 = 20;
      number += 10;

      console.log(number1);

      // 2. Use *= to multiply a variable by 4
      let value = 5;
      value *= 4;

      console.log(value);

      // 3. Check whether 50 == "50"
      let a = 50;
      let b = "50";

      console.log(a == b);

      // 4. Check whether 50 === "50"
      console.log(a === b);

      //       Compare if 25 > 18.
      // Compare if 10 < 5.
      // Check if 100 >= 100.
      // Check if 15 <= 20.
      // Check if 9 != 10.
      // Check if 9 !== "9".

      let g = 25;
      let h = 18;
      console.log(g > h);

      let i = 10;
      let j = 5;
      console.log(i < j);

      let k = 100;
      let l = 100;
      console.log(k >= l);

      let m = 15;
      let n = 20;
      console.log(m <= n);

      let o = 9;
      let p = 10;
      console.log(o != p);

      let q = 9;
      let r = "9";
      console.log(q !== r);
    </script>
  </body>
</html>
